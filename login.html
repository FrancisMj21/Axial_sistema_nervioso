<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Atlas Interactivo</title>
  <style>
    :root {
      --bg: #07111c;
      --panel: #102236;
      --panel-2: #132b43;
      --text: #f3f7fb;
      --muted: #a8b8c8;
      --line: rgba(169, 198, 224, .2);
      --accent: #2f91ff;
      --accent-2: #f1c65d;
      --danger: #ff6f87;
      --shadow: 0 24px 80px rgba(0, 0, 0, .34);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px;
      color: var(--text);
      font-family: Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background:
        radial-gradient(700px 500px at 82% 14%, rgba(47, 145, 255, .18), transparent 62%),
        radial-gradient(520px 420px at 12% 84%, rgba(241, 198, 93, .1), transparent 64%),
        linear-gradient(135deg, #06101b 0%, #0b1c2e 52%, #06101b 100%);
    }

    button,
    input {
      font: inherit;
    }

    .login-shell {
      width: min(980px, 100%);
      min-height: 620px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 390px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(8, 20, 34, .78);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .login-visual {
      position: relative;
      min-height: 100%;
      padding: 42px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-right: 1px solid var(--line);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, .08), rgba(255, 255, 255, .02)),
        radial-gradient(circle at 50% 48%, rgba(47, 145, 255, .16), transparent 42%);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: inherit;
      text-decoration: none;
    }

    .brand__mark {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(47, 145, 255, .5);
      border-radius: 12px;
      color: #fff;
      background: linear-gradient(180deg, #1479e9, #1164c5);
      font-weight: 900;
      letter-spacing: .04em;
      box-shadow: 0 10px 30px rgba(47, 145, 255, .25);
    }

    .brand strong,
    .brand small {
      display: block;
    }

    .brand small {
      margin-top: 2px;
      color: var(--muted);
    }

    .neuro-map {
      position: absolute;
      inset: 120px 48px 126px;
      display: grid;
      place-items: center;
      opacity: .95;
    }

    .neuro-map::before,
    .neuro-map::after {
      content: "";
      position: absolute;
      border: 1px solid rgba(169, 198, 224, .2);
      border-radius: 50%;
    }

    .neuro-map::before {
      width: min(340px, 78%);
      aspect-ratio: 1;
      background:
        radial-gradient(circle at 50% 50%, rgba(241, 198, 93, .22) 0 5%, transparent 6%),
        repeating-radial-gradient(circle at 50% 50%, rgba(255, 255, 255, .08) 0 1px, transparent 1px 34px);
    }

    .neuro-map::after {
      width: min(460px, 96%);
      aspect-ratio: 1;
      border-color: rgba(47, 145, 255, .24);
    }

    .scan-line {
      width: min(420px, 90%);
      height: 2px;
      position: relative;
      z-index: 1;
      border-radius: 999px;
      background: linear-gradient(90deg, transparent, rgba(47, 145, 255, .9), transparent);
      box-shadow: 0 0 28px rgba(47, 145, 255, .65);
    }

    .hotspot {
      width: 13px;
      height: 13px;
      position: absolute;
      z-index: 2;
      border: 2px solid rgba(255, 255, 255, .88);
      border-radius: 50%;
      background: var(--accent-2);
      box-shadow: 0 0 0 8px rgba(241, 198, 93, .12);
    }

    .hotspot:nth-child(2) {
      top: 31%;
      left: 45%;
    }

    .hotspot:nth-child(3) {
      top: 54%;
      left: 58%;
      background: var(--accent);
      box-shadow: 0 0 0 8px rgba(47, 145, 255, .12);
    }

    .hotspot:nth-child(4) {
      top: 67%;
      left: 39%;
    }

    .visual-copy {
      position: relative;
      z-index: 3;
      max-width: 500px;
      align-self: end;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: #59aaff;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 560px;
      margin: 0 0 12px;
      font-size: clamp(34px, 5vw, 56px);
      line-height: 1;
      letter-spacing: 0;
    }

    .visual-copy p {
      max-width: 500px;
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
    }

    .login-panel {
      padding: 42px 34px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background: rgba(16, 34, 54, .86);
    }

    .login-panel h2 {
      margin: 0 0 8px;
      font-size: 28px;
      line-height: 1.1;
    }

    .login-panel > p {
      margin: 0 0 28px;
      color: var(--muted);
      line-height: 1.55;
    }

    .field {
      display: grid;
      gap: 8px;
      margin-bottom: 16px;
    }

    .field span {
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .field input {
      width: 100%;
      min-height: 48px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 14px;
      color: var(--text);
      background: rgba(7, 17, 28, .58);
      outline: none;
      transition: border-color .2s ease, box-shadow .2s ease, background-color .2s ease;
    }

    .field input:focus {
      border-color: rgba(47, 145, 255, .8);
      background: rgba(7, 17, 28, .82);
      box-shadow: 0 0 0 4px rgba(47, 145, 255, .14);
    }

    .actions {
      display: grid;
      gap: 10px;
      margin-top: 8px;
    }

    .btn {
      min-height: 48px;
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 0 16px;
      color: #fff;
      font-weight: 900;
      cursor: pointer;
      transition: transform .18s ease, border-color .18s ease, background-color .18s ease, box-shadow .18s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .btn:disabled {
      cursor: wait;
      opacity: .7;
      transform: none;
    }

    .btn-primary {
      background: linear-gradient(180deg, #1479e9, #1164c5);
      box-shadow: 0 14px 30px rgba(47, 145, 255, .24);
    }

    .btn-secondary {
      color: var(--text);
      border-color: var(--line);
      background: rgba(255, 255, 255, .06);
    }

    .status {
      min-height: 22px;
      margin: 16px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .status.is-error {
      color: var(--danger);
    }

    .status.is-success {
      color: #67c98d;
    }

    @media (max-width: 820px) {
      body {
        padding: 18px;
      }

      .login-shell {
        min-height: auto;
        grid-template-columns: 1fr;
      }

      .login-visual {
        min-height: 300px;
        padding: 28px;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .neuro-map {
        inset: 86px 18px 42px;
        opacity: .72;
      }

      .visual-copy {
        margin-top: 150px;
        align-self: start;
      }

      .visual-copy p {
        display: none;
      }

      .login-panel {
        padding: 30px 24px;
      }
    }
  </style>
</head>
<body>
  <main class="login-shell">
    <section class="login-visual" aria-label="Presentacion del atlas">
      <a class="brand" href="index.html">
        <span class="brand__mark" aria-hidden="true">SN</span>
        <span>
          <strong>Atlas Interactivo</strong>
          <small>Sistema Nervioso</small>
        </span>
      </a>

      <div class="neuro-map" aria-hidden="true">
        <span class="scan-line"></span>
        <span class="hotspot"></span>
        <span class="hotspot"></span>
        <span class="hotspot"></span>
      </div>

      <div class="visual-copy">
        <p class="eyebrow">Recurso academico</p>
        <h1>Explora el sistema nervioso axial</h1>
        <p>Accede al atlas para estudiar cortes, planos neuroanatomicos, estructuras encefalicas y terminos clave.</p>
      </div>
    </section>

    <section class="login-panel" aria-label="Formulario de acceso">
      <h2>Iniciar sesion</h2>
      <p>Claudia Oriana Taquila Arocutipa U25334012 </p>

      <form id="loginForm">
        <label class="field" for="email">
          <span>Correo</span>
          <input type="email" id="email" placeholder="####@gmail.com" autocomplete="email" required>
        </label>

        <label class="field" for="password">
          <span>Contrasena</span>
          <input type="password" id="password" placeholder="Ingresa tu contrasena" autocomplete="current-password" required>
        </label>

        <div class="actions">
          <button class="btn btn-primary" id="loginButton" type="submit">Entrar</button>
        </div>

        <p class="status" id="status" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
  const supabaseUrl = 'https://ebklccvfychuwrxmwngk.supabase.co';
  const supabaseKey = 'sb_publishable_z0SHVLv0iH-RYKB46mldmA_qwoNNsic';
  const client = window.supabase ? supabase.createClient(supabaseUrl, supabaseKey) : null;
  const form = document.getElementById('loginForm');
  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');
  const loginButton = document.getElementById('loginButton');
  const statusMessage = document.getElementById('status');

  if (localStorage.getItem("logged") === "true") {
      window.location.href = "index.html";
  }

  function setStatus(message, type) {
      statusMessage.textContent = message;
      statusMessage.className = type ? "status is-" + type : "status";
  }

  function setLoading(isLoading, message) {
      loginButton.disabled = isLoading;
      if (message) {
          setStatus(message);
      }
  }

  function getCredentials() {
      return {
          email: emailInput.value.trim(),
          password: passwordInput.value
      };
  }

  async function login() {
      const { email, password } = getCredentials();

      if (!email || !password) {
          setStatus("Ingresa correo y contrasena", "error");
          return;
      }

      if (!client) {
          setStatus("No se pudo cargar Supabase. Abre la pagina con conexion a internet o desde un servidor local.", "error");
          return;
      }

      setLoading(true, "Verificando credenciales...");

      const { error } = await client.auth.signInWithPassword({
          email,
          password
      });

      setLoading(false);

      if (error) {
          setStatus("Credenciales incorrectas", "error");
          return;
      }

      localStorage.setItem("logged", "true");
      window.location.href = "index.html";
  }

  form.addEventListener('submit', function (event) {
      event.preventDefault();
      login();
  });

  </script>
</body>
</html>
